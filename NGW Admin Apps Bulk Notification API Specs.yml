openapi: 3.0.0
info:
  title: ngw-admin-apps-bulk-notifications
  version: 1.0.0
  x-ibm-name: ngw-admin-apps-bulk-notifications
servers:
  - url: /api/admin/apps
    description: base path
tags:
  - name: Bulk Notifications
    description: Prepare, validate, submit, approve, and reject bulk SMS and Email notification requests
  - name: Bulk Notification Templates
    description: Search channel templates and generate upload files
paths:
  /bulk-notifications/templates:
    get:
      tags:
        - Bulk Notification Templates
      summary: Search bulk notification templates
      description: Returns active SMS or Email templates available for bulk notification requests.
      operationId: searchBulkNotificationTemplates
      x-ngw-permission: bulk-notification:view
      parameters:
        - $ref: '#/components/parameters/X-SAIB-Timestamp'
        - $ref: '#/components/parameters/X-SAIB-Function'
        - $ref: '#/components/parameters/X-SAIB-Transaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Interaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Correlation-Id'
        - $ref: '#/components/parameters/X-SAIB-Language'
        - $ref: '#/components/parameters/X-SAIB-Time-Zone'
        - $ref: '#/components/parameters/X-SAIB-Channel'
        - $ref: '#/components/parameters/X-SAIB-CIF'
        - $ref: '#/components/parameters/X-SAIB-Customer-IP-Address'
        - $ref: '#/components/parameters/X-SAIB-Idempotency-Key'
        - $ref: '#/components/parameters/X-JWS-Signature'
        - $ref: '#/components/parameters/X-SAIB-Session-Id'
        - $ref: '#/components/parameters/X-SAIB-Screen-Id'
        - name: channel
          in: query
          required: true
          schema:
            type: string
            enum: [SMS, EMAIL]
          description: Delivery channel for the template LOV.
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Optional search term for template name or code.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
            default: ACTIVE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkTemplateSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /bulk-notifications/templates/{templateCode}:
    get:
      tags:
        - Bulk Notification Templates
      summary: Get template details
      description: Returns template metadata, parameters, and supported bulk options for the selected channel template.
      operationId: getBulkNotificationTemplateDetails
      x-ngw-permission: bulk-notification:view
      parameters:
        - $ref: '#/components/parameters/X-SAIB-Timestamp'
        - $ref: '#/components/parameters/X-SAIB-Function'
        - $ref: '#/components/parameters/X-SAIB-Transaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Interaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Correlation-Id'
        - $ref: '#/components/parameters/X-SAIB-Language'
        - $ref: '#/components/parameters/X-SAIB-Time-Zone'
        - $ref: '#/components/parameters/X-SAIB-Channel'
        - $ref: '#/components/parameters/X-SAIB-CIF'
        - $ref: '#/components/parameters/X-SAIB-Customer-IP-Address'
        - $ref: '#/components/parameters/X-SAIB-Idempotency-Key'
        - $ref: '#/components/parameters/X-JWS-Signature'
        - $ref: '#/components/parameters/X-SAIB-Session-Id'
        - $ref: '#/components/parameters/X-SAIB-Screen-Id'
        - name: templateCode
          in: path
          required: true
          schema:
            type: string
            example: 3DS_OTP
        - name: channel
          in: query
          required: true
          schema:
            type: string
            enum: [SMS, EMAIL]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTemplateDetails'
        '404':
          $ref: '#/components/responses/NotFound'

  /bulk-notifications/excel-template:
    post:
      tags:
        - Bulk Notification Templates
      summary: Generate bulk upload Excel template
      description: Generates an Excel file structure based on selected channel, template, recipient identifier type, contact override option, and parameter mode.
      operationId: generateBulkNotificationExcelTemplate
      x-ngw-permission: bulk-notification:create
      parameters:
        - $ref: '#/components/parameters/X-SAIB-Timestamp'
        - $ref: '#/components/parameters/X-SAIB-Function'
        - $ref: '#/components/parameters/X-SAIB-Transaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Interaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Correlation-Id'
        - $ref: '#/components/parameters/X-SAIB-Language'
        - $ref: '#/components/parameters/X-SAIB-Time-Zone'
        - $ref: '#/components/parameters/X-SAIB-Channel'
        - $ref: '#/components/parameters/X-SAIB-CIF'
        - $ref: '#/components/parameters/X-SAIB-Customer-IP-Address'
        - $ref: '#/components/parameters/X-SAIB-Idempotency-Key'
        - $ref: '#/components/parameters/X-JWS-Signature'
        - $ref: '#/components/parameters/X-SAIB-Session-Id'
        - $ref: '#/components/parameters/X-SAIB-Screen-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkExcelTemplateRequest'
      responses:
        '200':
          description: Excel template generated
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'

  /bulk-notifications/validate-upload:
    post:
      tags:
        - Bulk Notifications
      summary: Validate uploaded bulk recipient file
      description: Uploads and validates a completed Excel file. The response returns validation summary and first five parsed rows only.
      operationId: validateBulkNotificationUpload
      x-ngw-permission: bulk-notification:create
      parameters:
        - $ref: '#/components/parameters/X-SAIB-Timestamp'
        - $ref: '#/components/parameters/X-SAIB-Function'
        - $ref: '#/components/parameters/X-SAIB-Transaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Interaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Correlation-Id'
        - $ref: '#/components/parameters/X-SAIB-Language'
        - $ref: '#/components/parameters/X-SAIB-Time-Zone'
        - $ref: '#/components/parameters/X-SAIB-Channel'
        - $ref: '#/components/parameters/X-SAIB-CIF'
        - $ref: '#/components/parameters/X-SAIB-Customer-IP-Address'
        - $ref: '#/components/parameters/X-SAIB-Idempotency-Key'
        - $ref: '#/components/parameters/X-JWS-Signature'
        - $ref: '#/components/parameters/X-SAIB-Session-Id'
        - $ref: '#/components/parameters/X-SAIB-Screen-Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request, file]
              properties:
                request:
                  $ref: '#/components/schemas/BulkUploadValidationRequest'
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUploadValidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /bulk-notifications/requests:
    post:
      tags:
        - Bulk Notifications
      summary: Submit bulk notification request
      description: Creates a bulk notification request and a pending approval task with process code BULK_NOTIFICATION_PROCSS.
      operationId: submitBulkNotificationRequest
      x-ngw-permission: bulk-notification:create
      parameters:
        - $ref: '#/components/parameters/X-SAIB-Timestamp'
        - $ref: '#/components/parameters/X-SAIB-Function'
        - $ref: '#/components/parameters/X-SAIB-Transaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Interaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Correlation-Id'
        - $ref: '#/components/parameters/X-SAIB-Language'
        - $ref: '#/components/parameters/X-SAIB-Time-Zone'
        - $ref: '#/components/parameters/X-SAIB-Channel'
        - $ref: '#/components/parameters/X-SAIB-CIF'
        - $ref: '#/components/parameters/X-SAIB-Customer-IP-Address'
        - $ref: '#/components/parameters/X-SAIB-Idempotency-Key'
        - $ref: '#/components/parameters/X-JWS-Signature'
        - $ref: '#/components/parameters/X-SAIB-Session-Id'
        - $ref: '#/components/parameters/X-SAIB-Screen-Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkNotificationSubmitRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkNotificationSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags:
        - Bulk Notifications
      summary: List bulk notification requests
      operationId: listBulkNotificationRequests
      x-ngw-permission: bulk-notification:view
      parameters:
        - $ref: '#/components/parameters/X-SAIB-Timestamp'
        - $ref: '#/components/parameters/X-SAIB-Function'
        - $ref: '#/components/parameters/X-SAIB-Transaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Interaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Correlation-Id'
        - $ref: '#/components/parameters/X-SAIB-Language'
        - $ref: '#/components/parameters/X-SAIB-Time-Zone'
        - $ref: '#/components/parameters/X-SAIB-Channel'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BulkNotificationStatus'
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum: [SMS, EMAIL]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkNotificationRequestSummary'

  /bulk-notifications/requests/{bulkRequestId}:
    get:
      tags:
        - Bulk Notifications
      summary: Get bulk notification request details
      operationId: getBulkNotificationRequest
      x-ngw-permission: bulk-notification:view
      parameters:
        - $ref: '#/components/parameters/X-SAIB-Timestamp'
        - $ref: '#/components/parameters/X-SAIB-Function'
        - $ref: '#/components/parameters/X-SAIB-Transaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Interaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Correlation-Id'
        - name: bulkRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkNotificationRequestDetails'
        '404':
          $ref: '#/components/responses/NotFound'

  /bulk-notifications/tasks/{taskId}/approve:
    post:
      tags:
        - Bulk Notifications
      summary: Approve bulk notification task
      operationId: approveBulkNotificationTask
      x-ngw-permission: bulk-notification:approve
      parameters:
        - $ref: '#/components/parameters/X-SAIB-Timestamp'
        - $ref: '#/components/parameters/X-SAIB-Function'
        - $ref: '#/components/parameters/X-SAIB-Transaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Interaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Correlation-Id'
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDecisionRequest'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDecisionResponse'

  /bulk-notifications/tasks/{taskId}/reject:
    post:
      tags:
        - Bulk Notifications
      summary: Reject bulk notification task
      operationId: rejectBulkNotificationTask
      x-ngw-permission: bulk-notification:approve
      parameters:
        - $ref: '#/components/parameters/X-SAIB-Timestamp'
        - $ref: '#/components/parameters/X-SAIB-Function'
        - $ref: '#/components/parameters/X-SAIB-Transaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Interaction-Id'
        - $ref: '#/components/parameters/X-SAIB-Correlation-Id'
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDecisionRequest'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDecisionResponse'

components:
  parameters:
    X-SAIB-Timestamp:
      name: X-SAIB-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
    X-SAIB-Function:
      name: X-SAIB-Function
      in: header
      required: true
      schema:
        type: string
    X-SAIB-Transaction-Id:
      name: X-SAIB-Transaction-Id
      in: header
      required: true
      schema:
        type: string
    X-SAIB-Interaction-Id:
      name: X-SAIB-Interaction-Id
      in: header
      required: false
      schema:
        type: string
    X-SAIB-Correlation-Id:
      name: X-SAIB-Correlation-Id
      in: header
      required: true
      schema:
        type: string
    X-SAIB-Language:
      name: X-SAIB-Language
      in: header
      required: false
      schema:
        type: string
        enum: [EN, AR]
    X-SAIB-Time-Zone:
      name: X-SAIB-Time-Zone
      in: header
      required: false
      schema:
        type: string
        example: UTC+03:00
    X-SAIB-Channel:
      name: X-SAIB-Channel
      in: header
      required: true
      schema:
        type: string
        example: NGW_ADMIN_PORTAL
    X-SAIB-CIF:
      name: X-SAIB-CIF
      in: header
      required: false
      schema:
        type: string
    X-SAIB-Customer-IP-Address:
      name: X-SAIB-Customer-IP-Address
      in: header
      required: false
      schema:
        type: string
    X-SAIB-Idempotency-Key:
      name: X-SAIB-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    X-JWS-Signature:
      name: X-JWS-Signature
      in: header
      required: false
      schema:
        type: string
    X-SAIB-Session-Id:
      name: X-SAIB-Session-Id
      in: header
      required: false
      schema:
        type: string
    X-SAIB-Screen-Id:
      name: X-SAIB-Screen-Id
      in: header
      required: false
      schema:
        type: string
  schemas:
    BulkChannel:
      type: string
      enum: [SMS, EMAIL]
    RecipientIdType:
      type: string
      enum: [CIF, ACC_NUM, USER_ID]
    BulkNotificationStatus:
      type: string
      enum: [DRAFT, VALIDATED, PENDING_APPROVAL, APPROVED, REJECTED, DISPATCHING, COMPLETED, PARTIALLY_FAILED, FAILED]
    BulkTemplateSummary:
      type: object
      properties:
        templateCode:
          type: string
          example: 3DS_OTP
        templateName:
          type: string
          example: 3DS OTP
        channel:
          $ref: '#/components/schemas/BulkChannel'
        applications:
          type: array
          items:
            type: string
        status:
          type: string
          example: ACTIVE
    BulkTemplateDetails:
      allOf:
        - $ref: '#/components/schemas/BulkTemplateSummary'
        - type: object
          properties:
            parameters:
              type: array
              items:
                $ref: '#/components/schemas/TemplateParameter'
            metadata:
              type: array
              items:
                $ref: '#/components/schemas/TemplateMetadata'
    TemplateParameter:
      type: object
      properties:
        name:
          type: string
          example: amount
        description:
          type: string
          example: Transaction Amount
        required:
          type: boolean
        mask:
          type: boolean
        defaultValue:
          type: string
          nullable: true
    TemplateMetadata:
      type: object
      properties:
        key:
          type: string
          example: ntf.http.header.correlationId
        value:
          type: string
          nullable: true
    BulkExcelTemplateRequest:
      type: object
      required: [channel, templateCode, recipientIdType, overrideRecipientContacts, perRecipientParameters]
      properties:
        channel:
          $ref: '#/components/schemas/BulkChannel'
        templateCode:
          type: string
        recipientIdType:
          $ref: '#/components/schemas/RecipientIdType'
        overrideRecipientContacts:
          type: boolean
        perRecipientParameters:
          type: boolean
        staticParameters:
          $ref: '#/components/schemas/LocalizedParameters'
    BulkUploadValidationRequest:
      allOf:
        - $ref: '#/components/schemas/BulkExcelTemplateRequest'
        - type: object
          properties:
            fileName:
              type: string
              example: bulk-notification-template.xlsx
    BulkUploadValidationResponse:
      type: object
      properties:
        validationId:
          type: string
          format: uuid
        valid:
          type: boolean
        totalRows:
          type: integer
        validRows:
          type: integer
        invalidRows:
          type: integer
        previewRows:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/BulkRecipientPreviewRow'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BulkValidationError'
    BulkNotificationSubmitRequest:
      type: object
      required: [validationId, channel, templateCode, recipientIdType]
      properties:
        validationId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/BulkChannel'
        templateCode:
          type: string
        recipientIdType:
          $ref: '#/components/schemas/RecipientIdType'
        priority:
          type: integer
          example: 2
        category:
          type: string
          example: TRX
        comment:
          type: string
    BulkNotificationSubmitResponse:
      type: object
      properties:
        bulkRequestId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        processCode:
          type: string
          example: BULK_NOTIFICATION_PROCSS
        status:
          $ref: '#/components/schemas/BulkNotificationStatus'
    BulkNotificationRequestSummary:
      type: object
      properties:
        bulkRequestId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/BulkChannel'
        templateCode:
          type: string
        recipientCount:
          type: integer
        status:
          $ref: '#/components/schemas/BulkNotificationStatus'
        createdDate:
          type: string
          format: date-time
    BulkNotificationRequestDetails:
      allOf:
        - $ref: '#/components/schemas/BulkNotificationRequestSummary'
        - type: object
          properties:
            taskId:
              type: string
              format: uuid
            processCode:
              type: string
              example: BULK_NOTIFICATION_PROCSS
            staticParameters:
              $ref: '#/components/schemas/LocalizedParameters'
            metadata:
              type: object
              additionalProperties:
                type: string
            previewRows:
              type: array
              maxItems: 5
              items:
                $ref: '#/components/schemas/BulkRecipientPreviewRow'
    BulkRecipientPreviewRow:
      type: object
      properties:
        rowNumber:
          type: integer
        recipientIdType:
          $ref: '#/components/schemas/RecipientIdType'
        recipientId:
          type: string
        recipientMobileNumber:
          type: string
          nullable: true
        recipientEmailAddress:
          type: string
          nullable: true
        parameters:
          type: object
          additionalProperties:
            type: string
        validationStatus:
          type: string
          enum: [VALID, INVALID]
    BulkValidationError:
      type: object
      properties:
        rowNumber:
          type: integer
          nullable: true
        code:
          type: string
          example: BULK_MISSING_EMAIL
        message:
          type: string
    LocalizedParameters:
      type: object
      properties:
        en:
          type: object
          additionalProperties:
            type: string
        ar:
          type: object
          additionalProperties:
            type: string
    TaskDecisionRequest:
      type: object
      properties:
        comment:
          type: string
          example: Approved after validating recipient file.
    TaskDecisionResponse:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        bulkRequestId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BulkNotificationStatus'
        decisionDate:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
    Forbidden:
      description: Forbidden
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
