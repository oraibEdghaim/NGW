openapi: 3.0.0
info:
  title: ngw-admin-apps-events
  version: 1.0.0
  x-ibm-name: ngw-admin-apps-events
servers:
  - url: /api/admin/apps
    description: base path
tags:
  - name: Event Definition Management
    description: APIs for managing event definitions
  - name: Event Mapping Management
    description: APIs for managing event-to-template mappings
paths:
  /events:
    get:
      tags:
        - Event Definition Management
      summary: List event definitions
      description: Retrieve event definitions with optional filters and pagination.
      operationId: list_1
      parameters:
        - name: sourceSystem
          in: query
          description: Filter by source system
          required: false
          schema:
            type: string
        - name: eventCode
          in: query
          description: Filter by event code
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Requested page (zero-based)
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          description: Requested page size
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: Successfully retrieved event definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinitionDocument'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags:
        - Event Definition Management
      summary: Create event definition
      description: Create a new event definition.
      operationId: create_1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDefinitionDocument'
      responses:
        '201':
          description: Event definition created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Event definition already exists
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /events/lookups:
    get:
      tags:
        - Event Definition Management
      summary: Get event definition lookups
      description: Retrieve enum values used when creating or updating event definitions.
      operationId: getEventDefinitionLookups
      responses:
        '200':
          description: Successfully retrieved event definition lookups
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /events/test:
    post:
      tags:
        - Event Definition Management
      summary: Test event definition
      description: Validate that all configured required paths exist in the sample event payload.
      operationId: test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDefinitionDocument'
      responses:
        '200':
          description: Event definition test completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestEventDefinitionResponse'
        '400':
          description: Invalid event definition
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /events/{eventId}:
    get:
      tags:
        - Event Definition Management
      summary: Get event definition by ID
      description: Retrieve a single event definition by its ID.
      operationId: getById
      parameters:
        - name: eventId
          in: path
          description: Event definition ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved event definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinitionDocument'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Event definition not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    put:
      tags:
        - Event Definition Management
      summary: Update event definition
      description: Update an existing event definition by its ID.
      operationId: update
      parameters:
        - name: eventId
          in: path
          description: Event definition ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventDefinitionDocument'
      responses:
        '200':
          description: Event definition updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Event definition not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Event definition already exists
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /events/{eventId}/status:
    patch:
      tags:
        - Event Definition Management
      summary: Update event definition status
      description: Update the status of an event definition.
      operationId: updateStatus
      parameters:
        - name: eventId
          in: path
          description: Event definition ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinitionDocument'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Event definition not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /events/mappings:
    get:
      tags:
        - Event Mapping Management
      summary: List event mappings
      description: Retrieve event mappings with optional filters and pagination.
      operationId: list
      parameters:
        - name: sourceSystem
          in: query
          description: Filter by source system
          required: false
          schema:
            type: string
        - name: eventCode
          in: query
          description: Filter by event code
          required: false
          schema:
            type: string
        - name: templateCode
          in: query
          description: Filter by template code
          required: false
          schema:
            type: string
        - name: active
          in: query
          description: Filter by active status
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          description: Requested page (zero-based)
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          description: Requested page size
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: Successfully retrieved event mappings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventMappingDocument'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags:
        - Event Mapping Management
      summary: Create event mapping
      description: Publish a new mapping as active version 1.0.
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventMappingDocument'
      responses:
        '201':
          description: Event mapping created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventMappingDocument'
        '400':
          description: Invalid mapping data provided
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /events/mappings/test:
    post:
      tags:
        - Event Mapping Management
      summary: Stage and test event mapping
      description: Save the mapping as inactive version 1.1 and immediately test it using the supplied sample event envelope.
      operationId: test_1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestMappingRequest'
      responses:
        '200':
          description: Mapping staged and tested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMappingResponse'
        '400':
          description: Invalid mapping or sample data
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /events/mappings/{mappingId}:
    get:
      tags:
        - Event Mapping Management
      summary: Get event mapping by ID
      description: Retrieve a single event mapping by its ID.
      operationId: get
      parameters:
        - name: mappingId
          in: path
          description: Mapping ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved event mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventMappingDocument'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Mapping not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    put:
      tags:
        - Event Mapping Management
      summary: Update event mapping
      description: Publish staged changes into an existing active version 1.0 mapping.
      operationId: update_1
      parameters:
        - name: mappingId
          in: path
          description: Mapping ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventMappingDocument'
      responses:
        '200':
          description: Event mapping updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventMappingDocument'
        '400':
          description: Invalid mapping data provided
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Mapping not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /events/mappings/{mappingId}/active:
    patch:
      tags:
        - Event Mapping Management
      summary: Set mapping active status
      description: Activate or deactivate a live event mapping.
      operationId: setActive
      parameters:
        - name: mappingId
          in: path
          description: Mapping ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveRequest'
      responses:
        '200':
          description: Event mapping status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventMappingDocument'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Mapping not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  schemas:
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        rejectedValue: {}
    ValidationErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        path:
          type: string
        requestId:
          type: string
    ApiErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string
        requestId:
          type: string
    EventIdentificationRule:
      type: object
      properties:
        from:
          type: string
        operator:
          type: string
          enum:
            - EQUALS
            - NOT_EQUALS
            - IN
            - EXISTS
            - REGEX
        value:
          type: string
        priority:
          type: integer
          format: int32
        required:
          type: boolean
    RecipientRule:
      type: object
      properties:
        recipientIdType:
          type: string
        from:
          type: string
        required:
          type: boolean
        priority:
          type: integer
          format: int32
        defaultValue:
          type: string
    EventDefinitionDocument:
      type: object
      properties:
        id:
          type: string
        sourceSystem:
          type: string
          enum:
            - ESB
            - PAYMENT_HUB
            - ICS
            - NCIB
        sourceSystemEvent:
          type: string
        eventIdentificationRules:
          type: array
          items:
            $ref: '#/components/schemas/EventIdentificationRule'
        eventCode:
          type: string
        eventName:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        schemaVersion:
          type: integer
          format: int32
        ownerGroup:
          type: string
        subjectType:
          type: string
          enum:
            - CUSTOMER
            - ACCOUNT
            - CARD
            - EMPLOYEE
            - PAYMENT
            - APPLICATION
            - OTHER
        subjectIdPath:
          type: string
        recipientIdType:
          type: string
        recipientRules:
          type: array
          items:
            $ref: '#/components/schemas/RecipientRule'
        recipientResolutionStrategy:
          type: string
          enum:
            - FIRST_MATCH
            - REQUIRED_FIRST_MATCH
            - ALL_MATCHES
        payloadFormat:
          type: string
          enum:
            - JSON
            - XML
            - FIXED_LENGTH
        pathLanguage:
          type: string
          enum:
            - JSON_PATH
            - XML_PATH
            - FIXED_POSITION
            - REGEX
        schemaMode:
          type: string
          enum:
            - LENIENT
            - STRICT
            - SAMPLE_ONLY
        requiredPaths:
          type: array
          items:
            type: string
        idempotencyPath:
          type: string
        correlationIdPath:
          type: string
        sourceChannelPath:
          type: string
        eventTimePath:
          type: string
        eventPayload:
          type: object
          additionalProperties: true
        payloadParameters:
          type: array
          items:
            type: string
        allowedIngress:
          type: array
          items:
            type: string
            enum:
              - REST
              - KAFKA
              - MQ
        createdBy:
          type: string
        createdDate:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        lastModifiedDate:
          type: string
          format: date-time
    EventResponse:
      type: object
      properties:
        eventId:
          type: string
        sourceSystem:
          type: string
        eventCode:
          type: string
        status:
          type: string
        schemaVersion:
          type: integer
          format: int32
        createdDate:
          type: string
          format: date-time
        message:
          type: string
    StatusRequest:
      type: object
      properties:
        status:
          type: string
    TestEventDefinitionResponse:
      type: object
      properties:
        valid:
          type: boolean
        missingRequiredPaths:
          type: array
          items:
            type: string
        message:
          type: string
    ChannelSelection:
      type: object
      properties:
        mode:
          type: string
          enum:
            - FORCED_ONLY
            - REQUESTED_ONLY
            - REQUESTED_OR_DEFAULT
            - REQUESTED_OR_FORCED
            - CUSTOMER_PREFERENCES
        from:
          type: string
        defaultChannels:
          type: array
          items:
            type: string
            enum:
              - SMS
              - PUSH
              - EMAIL
              - WHATSAPP
              - IVR
        mandatoryChannels:
          type: array
          items:
            type: string
            enum:
              - SMS
              - PUSH
              - EMAIL
              - WHATSAPP
              - IVR
        allowedChannels:
          type: array
          items:
            type: string
            enum:
              - SMS
              - PUSH
              - EMAIL
              - WHATSAPP
              - IVR
    MetadataMapping:
      type: object
      properties:
        key:
          type: string
        from:
          type: string
        value:
          type: string
        required:
          type: boolean
    ParameterMapping:
      type: object
      properties:
        templateParam:
          type: string
        from:
          type: string
        required:
          type: boolean
        format:
          type: string
          enum:
            - NONE
            - MONEY_2DP
            - DATE_ISO
            - CURRENCY_CODE
            - AMOUNT_WITH_CURRENCY
            - DATE_HIJRI
            - DATETIME_BANK
            - MASK_ACCOUNT
            - MASK_CARD
            - IBAN_MASK
            - CARD_SCHEME
            - MERCHANT_NAME
            - TRANSACTION_TYPE
            - REFERENCE_NUMBER
            - UPPERCASE
            - LOWERCASE
            - TITLE_CASE
            - ARABIC_DIGITS
        defaultValue:
          type: string
    EventMappingDocument:
      type: object
      properties:
        mappingId:
          type: string
        sourceSystem:
          type: string
          enum:
            - ESB
            - PAYMENT_HUB
            - ICS
            - NCIB
        eventCode:
          type: string
        templateCode:
          type: string
        templateCodeStrategy:
          type: string
          enum:
            - STATIC
            - BY_PAYLOAD_VALUE
            - BY_LANGUAGE
        version:
          type: string
        active:
          type: boolean
        deliveryType:
          type: string
          enum:
            - DIRECT
            - FANOUT
            - BULK
        forceChannels:
          type: array
          items:
            type: string
            enum:
              - SMS
              - PUSH
              - EMAIL
              - WHATSAPP
              - IVR
        channelSelection:
          $ref: '#/components/schemas/ChannelSelection'
        channelPreferencePath:
          type: string
        categoryOverride:
          type: string
        priorityOverride:
          type: integer
          format: int32
        parameterMappings:
          type: array
          items:
            $ref: '#/components/schemas/ParameterMapping'
        metadataMappings:
          type: array
          items:
            $ref: '#/components/schemas/MetadataMapping'
        createdBy:
          type: string
        createdDate:
          type: string
          format: date-time
        lastModifiedBy:
          type: string
        lastModifiedDate:
          type: string
          format: date-time
    TestMappingRequest:
      type: object
      properties:
        sourceSystem:
          type: string
        eventCode:
          type: string
        templateCode:
          type: string
        mapping:
          $ref: '#/components/schemas/EventMappingDocument'
        sampleEventEnvelope:
          type: object
          additionalProperties: true
    TestMappingResponse:
      type: object
      properties:
        ok:
          type: boolean
        missingRequired:
          type: array
          items:
            type: string
        resolvedTemplateParameters:
          type: object
          additionalProperties:
            type: string
        resolvedMetadata:
          type: object
          additionalProperties:
            type: string
        channels:
          type: array
          items:
            type: string
        templateCode:
          type: string
        deliveryType:
          type: string
        categoryOverride:
          type: string
        priorityOverride:
          type: integer
          format: int32
    ActiveRequest:
      type: object
      properties:
        active:
          type: boolean
